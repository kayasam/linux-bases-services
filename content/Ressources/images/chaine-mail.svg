<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 390" role="img" aria-labelledby="t d"><title id="t">Chaîne de traitement d'un courrier électronique</title><desc id="d">Le webmail soumet un message à Postfix, qui le dépose dans Maildir ; Dovecot expose ensuite cette boîte par IMAP au destinataire.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.t{font:16px system-ui,sans-serif;fill:#0f172a}.s{font:13px system-ui,sans-serif;fill:#475569}.l{stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1150" height="390" rx="18" fill="#f8fafc"/><text x="575" y="35" text-anchor="middle" class="t" font-weight="700">Émission et consultation empruntent deux protocoles différents</text><g stroke-width="2"><rect x="25" y="125" width="165" height="100" rx="12" fill="#e2e8f0" stroke="#475569"/><text x="107" y="160" text-anchor="middle" class="t">Expéditeur</text><text x="107" y="185" text-anchor="middle" class="s">webmail / client</text><text x="107" y="207" text-anchor="middle" class="s">soumission SMTP</text><rect x="245" y="125" width="165" height="100" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="327" y="160" text-anchor="middle" class="t">Postfix</text><text x="327" y="185" text-anchor="middle" class="s">MTA : transporte</text><text x="327" y="207" text-anchor="middle" class="s">et remet localement</text><rect x="465" y="125" width="165" height="100" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="547" y="160" text-anchor="middle" class="t">Maildir</text><text x="547" y="185" text-anchor="middle" class="s">new · cur · tmp</text><text x="547" y="207" text-anchor="middle" class="s">un fichier / message</text><rect x="685" y="125" width="165" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="767" y="160" text-anchor="middle" class="t">Dovecot</text><text x="767" y="185" text-anchor="middle" class="s">serveur IMAP</text><text x="767" y="207" text-anchor="middle" class="s">authentifie et expose</text><rect x="905" y="125" width="210" height="100" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="1010" y="160" text-anchor="middle" class="t">Destinataire</text><text x="1010" y="185" text-anchor="middle" class="s">webmail / client</text><text x="1010" y="207" text-anchor="middle" class="s">consultation IMAP</text></g><path d="M190 175H245" class="l"/><path d="M410 175H465" class="l"/><path d="M630 175H685" class="l"/><path d="M850 175H905" class="l"/><text x="217" y="155" text-anchor="middle" class="s">SMTP</text><text x="877" y="155" text-anchor="middle" class="s">IMAP</text><rect x="320" y="285" width="510" height="55" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="575" y="318" text-anchor="middle" class="t">DNS indique où livrer ; TLS protège ; les journaux relient les étapes</text></svg>
