<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="t d"><title id="t">Trajet d'une requête dans une pile LAMP</title><desc id="d">Le navigateur résout le nom, contacte Apache, qui sert un fichier statique ou exécute PHP, lequel peut interroger MariaDB.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.t{font:17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.l{stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1100" height="390" rx="18" fill="#f8fafc"/><text x="550" y="35" text-anchor="middle" class="t" font-weight="700">Trajet d'une requête HTTP dynamique</text><g stroke-width="2"><rect x="30" y="130" width="155" height="90" rx="12" fill="#e2e8f0" stroke="#475569"/><text x="107" y="165" text-anchor="middle" class="t">Navigateur</text><text x="107" y="193" text-anchor="middle" class="s">client HTTP</text><rect x="250" y="130" width="155" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="327" y="165" text-anchor="middle" class="t">DNS</text><text x="327" y="193" text-anchor="middle" class="s">nom → IP</text><rect x="470" y="130" width="155" height="90" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="547" y="165" text-anchor="middle" class="t">Apache</text><text x="547" y="193" text-anchor="middle" class="s">vhost + port 80</text><rect x="690" y="70" width="155" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="767" y="105" text-anchor="middle" class="t">PHP</text><text x="767" y="133" text-anchor="middle" class="s">logique serveur</text><rect x="915" y="70" width="155" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="992" y="105" text-anchor="middle" class="t">MariaDB</text><text x="992" y="133" text-anchor="middle" class="s">données SQL</text><rect x="690" y="245" width="155" height="70" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="767" y="275" text-anchor="middle" class="t">Fichier statique</text><text x="767" y="298" text-anchor="middle" class="s">HTML · CSS · image</text></g><path d="M185 175H250" class="l"/><path d="M405 175H470" class="l"/><path d="M625 150L690 120" class="l"/><path d="M845 115H915" class="l"/><path d="M625 200L690 275" class="l"/><path d="M915 145H845" class="l"/><path d="M690 145L625 170" class="l"/><path d="M470 205H185" class="l"/><text x="550" y="355" text-anchor="middle" class="s">Une réponse 200 ne prouve pas tout : tester DNS, socket, vhost, PHP puis SQL séparément</text></svg>
