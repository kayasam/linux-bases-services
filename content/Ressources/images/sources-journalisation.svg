<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
  <title id="title">Sources et consultation des journaux Linux</title><desc id="desc">Le noyau, les services et l'authentification alimentent journald ; certaines applications écrivent aussi dans des fichiers de var log.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.h{font:700 21px system-ui,sans-serif;fill:#0f172a}.t{font:600 17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.flow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.copy{stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1160" height="500" rx="20" fill="#f8fafc"/><text x="580" y="38" text-anchor="middle" class="h">Choisir la source, puis réduire la fenêtre temporelle</text>
  <rect x="35" y="85" width="220" height="78" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="145" y="117" text-anchor="middle" class="t">Noyau</text><text x="145" y="143" text-anchor="middle" class="s">matériel · pilotes · OOM</text>
  <rect x="35" y="205" width="220" height="78" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="145" y="237" text-anchor="middle" class="t">Services systemd</text><text x="145" y="263" text-anchor="middle" class="s">SSH · BIND · Apache</text>
  <rect x="35" y="325" width="220" height="78" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="145" y="357" text-anchor="middle" class="t">Authentification</text><text x="145" y="383" text-anchor="middle" class="s">sudo · SSH · PAM</text>
  <rect x="355" y="155" width="240" height="180" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/><text x="475" y="198" text-anchor="middle" class="t">systemd-journald</text><text x="475" y="230" text-anchor="middle" class="s">entrées structurées</text><text x="475" y="256" text-anchor="middle" class="s">boot · unité · PID · priorité</text><rect x="395" y="280" width="160" height="35" rx="8" fill="#fff" stroke="#a5b4fc"/><text x="475" y="303" text-anchor="middle" class="s">journal binaire indexé</text>
  <rect x="710" y="90" width="260" height="120" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="840" y="128" text-anchor="middle" class="t">journalctl</text><text x="840" y="158" text-anchor="middle" class="s">-u service · -b · -p err</text><text x="840" y="183" text-anchor="middle" class="s">--since · -f · -k</text>
  <rect x="710" y="285" width="260" height="120" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="840" y="323" text-anchor="middle" class="t">Fichiers /var/log</text><text x="840" y="353" text-anchor="middle" class="s">auth.log · mail.log</text><text x="840" y="378" text-anchor="middle" class="s">apache2/access.log</text>
  <rect x="1010" y="185" width="115" height="115" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1067" y="220" text-anchor="middle" class="t">Preuve</text><text x="1067" y="248" text-anchor="middle" class="s">heure</text><text x="1067" y="271" text-anchor="middle" class="s">test</text><text x="1067" y="294" text-anchor="middle" class="s">message</text>
  <path d="M255 124L355 195" class="flow"/><path d="M255 244H355" class="flow"/><path d="M255 364L355 295" class="flow"/><path d="M595 205L710 150" class="flow"/><path d="M595 285L710 345" class="copy"/><path d="M970 150L1010 210" class="flow"/><path d="M970 345L1010 275" class="flow"/>
  <text x="650" y="324" text-anchor="middle" class="s">export / duplication</text><text x="580" y="462" text-anchor="middle" class="s">Méthode : reproduire → noter l'heure → filtrer le bon service → extraire seulement les lignes utiles</text>
</svg>
