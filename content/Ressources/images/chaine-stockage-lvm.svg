710" y="75" width="150" height="90" class="b" fill="#dcfce7" stroke="#16a34a"/><text x="785" y="108" text-anchor="middle" class="t">LV « web »</text><text x="785" y="137" text-anchor="middle" class="s">volume bloc</text><rect x="710" y="205" width="150" height="90" class="b" fill="#dcfce7" stroke="#16a34a"/><text x="785" y="238" text-anchor="middle" class="t">LV « mail »</text><text x="785" y="267" text-anchor="middle" class="s">volume bloc</text><rect x="920" y="75" width="145" height="90" class="b" fill="#fef3c7" stroke="#d97706"/><text x="992" y="108" text-anchor="middle" class="t">ext4</text><text x="992" y="137" text-anchor="middle" class="s">/srv/web</text><rect x="920" y="205" width="145" height="90" class="b" fill="#fef3c7" stroke="#d97706"/><text x="992" y="238" text-anchor="middle" class="t">xfs</text><text x="992" y="267" text-anchor="middle" class="s">/srv/mail</text><path d="M185 117H250" class="l"/><path d="M185 237H250" class="l"/><path d="M400 117L470 150" class="l"/><path d="M400 237L470 210" class="l"/><path d="M640 145L710 120" class="l"/><path d="M640 215L710 250" class="l"/><path d="M860 120H920" class="l"/><path d="M860 250H920" class="l"/><text x="550" y="330" text-anchor="middle" class="s">Agrandir dans l'ordre : capacité physique → PV/VG → LV → système de fichiers</text></svg>
