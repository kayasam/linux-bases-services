<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 400" role="img" aria-labelledby="t d"><title id="t">Relation entre processus et service systemd</title><desc id="d">Systemd démarre une unité qui crée un processus principal, éventuellement des enfants, regroupés dans un cgroup et observés dans le journal.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.t{font:17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.l{stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1050" height="400" rx="18" fill="#f8fafc"/><text x="525" y="35" text-anchor="middle" class="t" font-weight="700">Une unité systemd pilote un ensemble de processus</text><rect x="45" y="135" width="170" height="90" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="130" y="170" text-anchor="middle" class="t">systemd</text><text x="130" y="198" text-anchor="middle" class="s">PID 1</text><rect x="290" y="105" width="200" height="145" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="390" y="140" text-anchor="middle" class="t">apache2.service</text><text x="390" y="168" text-anchor="middle" class="s">état · dépendances</text><text x="390" y="191" text-anchor="middle" class="s">politique de reprise</text><text x="390" y="220" text-anchor="middle" class="s">un cgroup dédié</text><rect x="570" y="75" width="190" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="665" y="110" text-anchor="middle" class="t">processus maître</text><text x="665" y="138" text-anchor="middle" class="s">MainPID</text><rect x="570" y="220" width="190" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="665" y="255" text-anchor="middle" class="t">processus enfants</text><text x="665" y="283" text-anchor="middle" class="s">workers</text><rect x="835" y="135" width="170" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="920" y="170" text-anchor="middle" class="t">journald</text><text x="920" y="198" text-anchor="middle" class="s">stdout · erreurs</text><path d="M215 180H290" class="l"/><path d="M490 155L570 120" class="l"/><path d="M490 205L570 265" class="l"/><path d="M760 120L835 165" class="l"/><path d="M760 265L835 195" class="l"/><text x="525" y="355" text-anchor="middle" class="s">status = état synthétique · journalctl = chronologie détaillée · ps = vue processus</text></svg>
