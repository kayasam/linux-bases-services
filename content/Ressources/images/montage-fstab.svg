<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 330" role="img" aria-labelledby="t d"><title id="t">Montage temporaire et persistant</title><desc id="d">Un système de fichiers est relié à un point de montage ; la commande mount agit maintenant et fstab permet la persistance au démarrage.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.b{stroke-width:2}.t{font:17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#334155}.l{stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1050" height="330" rx="18" fill="#f8fafc"/><text x="525" y="35" text-anchor="middle" class="t" font-weight="700">Un montage relie un système de fichiers à l'arborescence</text><rect x="45" y="100" width="220" height="100" rx="12" class="b" fill="#dbeafe" stroke="#2563eb"/><text x="155" y="135" text-anchor="middle" class="t">Système de fichiers</text><text x="155" y="165" text-anchor="middle" class="s">UUID=… · ext4</text><text x="155" y="188" text-anchor="middle" class="s">contient les données</text><rect x="405" y="100" width="220" height="100" rx="12" class="b" fill="#dcfce7" stroke="#16a34a"/><text x="515" y="135" text-anchor="middle" class="t">Point de montage</text><text x="515" y="165" text-anchor="middle" class="s">/srv/data</text><text x="515" y="188" text-anchor="middle" class="s">dossier d'accès</text><rect x="765" y="70" width="235" height="70" rx="12" class="b" fill="#fef3c7" stroke="#d97706"/><text x="882" y="100" text-anchor="middle" class="t">mount</text><text x="882" y="123" text-anchor="middle" class="s">état courant</text><rect x="765" y="175" width="235" height="70" rx="12" class="b" fill="#ede9fe" stroke="#7c3aed"/><text x="882" y="205" text-anchor="middle" class="t">/etc/fstab</text><text x="882" y="228" text-anchor="middle" class="s">prochain démarrage</text><path d="M265 150H405" class="l"/><path d="M625 135L765 105" class="l"/><path d="M625 165L765 210" class="l"/><text x="515" y="285" text-anchor="middle" class="s">Validation sûre : findmnt --verify → mount -a → findmnt /srv/data</text></svg>
