<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="t d"><title id="t">Résolution DNS locale et transfert</title><desc id="d">Le client interroge BIND, qui répond depuis sa zone autoritaire ou transmet la demande à un résolveur externe.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.t{font:17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.l{stroke:#334155;stroke-width:2;marker-end:url(#a)}.r{stroke:#0284c7}.q{stroke:#7c3aed}</style></defs><rect width="1100" height="390" rx="18" fill="#f8fafc"/><text x="550" y="35" text-anchor="middle" class="t" font-weight="700">BIND choisit la réponse selon le nom demandé</text><rect x="40" y="140" width="180" height="90" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="130" y="175" text-anchor="middle" class="t">Client</text><text x="130" y="202" text-anchor="middle" class="s">résolveur local</text><rect x="340" y="115" width="220" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="150" text-anchor="middle" class="t">BIND9</text><text x="450" y="178" text-anchor="middle" class="s">cache + autorité locale</text><text x="450" y="205" text-anchor="middle" class="s">UDP 53, TCP 53</text><text x="450" y="232" text-anchor="middle" class="s">RA / AA dans dig</text><rect x="735" y="65" width="305" height="95" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="887" y="100" text-anchor="middle" class="t">Zone locale autoritaire</text><text x="887" y="128" text-anchor="middle" class="s">www.dawan.test → 192.168.56.200</text><rect x="735" y="230" width="305" height="95" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="887" y="265" text-anchor="middle" class="t">Résolveur externe</text><text x="887" y="293" text-anchor="middle" class="s">forwarder pour les autres domaines</text><path d="M220 175H340" class="l"/><text x="280" y="160" text-anchor="middle" class="s">requête</text><path d="M560 155L735 112" class="l r"/><path d="M560 215L735 277" class="l q"/><text x="647" y="117" text-anchor="middle" class="s">zone connue</text><text x="647" y="270" text-anchor="middle" class="s">autre nom</text><path d="M340 215H220" class="l"/><text x="280" y="242" text-anchor="middle" class="s">réponse + TTL</text><text x="550" y="360" text-anchor="middle" class="s">Diagnostic : serveur interrogé → code retour → section ANSWER → drapeaux → temps de réponse</text></svg>
