<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="t d"><title id="t">Parcours d'un paquet dans nftables</title><desc id="d">Le paquet entrant est orienté vers input s'il vise la machine, ou forward s'il est routé ; les paquets locaux passent par output.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.t{font:17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.l{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="420" rx="18" fill="#f8fafc"/><text x="550" y="35" text-anchor="middle" class="t" font-weight="700">Choisir la chaîne selon la destination du paquet</text><rect x="35" y="165" width="145" height="75" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="107" y="198" text-anchor="middle" class="t">Paquet entrant</text><text x="107" y="220" text-anchor="middle" class="s">interface réseau</text><polygon points="300,135 410,202 300,269 190,202" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="300" y="194" text-anchor="middle" class="t">Pour cette</text><text x="300" y="216" text-anchor="middle" class="t">machine ?</text><rect x="495" y="70" width="170" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="580" y="105" text-anchor="middle" class="t">input</text><text x="580" y="130" text-anchor="middle" class="s">service local</text><rect x="495" y="265" width="170" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="580" y="300" text-anchor="middle" class="t">forward</text><text x="580" y="325" text-anchor="middle" class="s">machine routeur</text><rect x="760" y="70" width="170" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="845" y="105" text-anchor="middle" class="t">Application</text><text x="845" y="130" text-anchor="middle" class="s">SSH · DNS · Web</text><rect x="760" y="265" width="170" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="845" y="300" text-anchor="middle" class="t">output</text><text x="845" y="325" text-anchor="middle" class="s">émis localement</text><path d="M180 202H190" class="l"/><path d="M410 175L495 110" class="l"/><path d="M410 229L495 305" class="l"/><path d="M665 110H760" class="l"/><path d="M845 150V265" class="l"/><path d="M930 305H1040" class="l"/><text x="450" y="128" class="s">oui</text><text x="445" y="283" class="s">non</text><text x="550" y="390" text-anchor="middle" class="s">La première règle correspondante décide : observer les compteurs et les handles pour prouver le chemin</text></svg>
