<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Architecture du laboratoire Linux</title><desc id="desc">Un poste client interroge un serveur Linux qui héberge DNS, Web, Mail, pare-feu et stockage.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.svc{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.sec{fill:#fef3c7;stroke:#d97706;stroke-width:2}.txt{font:18px system-ui,sans-serif;fill:#0f172a}.small{font:15px system-ui,sans-serif;fill:#334155}.line{stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="520" rx="18" fill="#f1f5f9"/>
  <text x="550" y="38" text-anchor="middle" class="txt" font-weight="700">Laboratoire fil rouge TSSR — 192.168.56.0/24</text>
  <rect x="45" y="180" width="210" height="120" rx="14" class="box"/><text x="150" y="220" text-anchor="middle" class="txt" font-weight="700">Poste client</text><text x="150" y="250" text-anchor="middle" class="small">navigateur · dig</text><text x="150" y="275" text-anchor="middle" class="small">SSH · client mail</text>
  <path d="M255 240H390" class="line"/><text x="322" y="225" text-anchor="middle" class="small">réseau privé</text>
  <rect x="390" y="70" width="660" height="390" rx="18" class="box"/><text x="720" y="105" text-anchor="middle" class="txt" font-weight="700">Serveur Linux — 192.168.56.200</text>
  <rect x="430" y="135" width="170" height="75" rx="12" class="svc"/><text x="515" y="165" text-anchor="middle" class="txt">DNS / BIND9</text><text x="515" y="190" text-anchor="middle" class="small">TCP + UDP 53</text>
  <rect x="635" y="135" width="170" height="75" rx="12" class="svc"/><text x="720" y="165" text-anchor="middle" class="txt">Web / LAMP</text><text x="720" y="190" text-anchor="middle" class="small">TCP 80</text>
  <rect x="840" y="135" width="170" height="75" rx="12" class="svc"/><text x="925" y="165" text-anchor="middle" class="txt">Mail</text><text x="925" y="190" text-anchor="middle" class="small">SMTP · IMAP</text>
  <rect x="430" y="255" width="580" height="70" rx="12" class="sec"/><text x="720" y="285" text-anchor="middle" class="txt">nftables : autoriser uniquement les flux utiles</text><text x="720" y="310" text-anchor="middle" class="small">observer avec ss · tester depuis le client · journaliser</text>
  <rect x="430" y="365" width="580" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="720" y="402" text-anchor="middle" class="txt">Stockage → systèmes de fichiers → données des services</text>
  <path d="M515 210V255" class="line"/><path d="M720 210V255" class="line"/><path d="M925 210V255" class="line"/><path d="M720 325V365" class="line"/>
</svg>
