<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 430" role="img" aria-labelledby="t d"><title id="t">Entonnoir de diagnostic TSSR</title><desc id="d">La recherche part du symptôme, vérifie réseau, port, service, configuration et journaux, puis valide le service rendu.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.t{font:17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.l{stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1050" height="430" rx="18" fill="#f8fafc"/><text x="525" y="35" text-anchor="middle" class="t" font-weight="700">Du symptôme à la preuve de rétablissement</text><g stroke-width="2"><rect x="40" y="90" width="150" height="70" rx="12" fill="#fee2e2" stroke="#dc2626"/><text x="115" y="120" text-anchor="middle" class="t">Symptôme</text><text x="115" y="143" text-anchor="middle" class="s">test reproductible</text><rect x="245" y="90" width="150" height="70" rx="12" fill="#ffedd5" stroke="#ea580c"/><text x="320" y="120" text-anchor="middle" class="t">Réseau</text><text x="320" y="143" text-anchor="middle" class="s">IP · route · DNS</text><rect x="450" y="90" width="150" height="70" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="525" y="120" text-anchor="middle" class="t">Socket</text><text x="525" y="143" text-anchor="middle" class="s">port en écoute</text><rect x="655" y="90" width="150" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="730" y="120" text-anchor="middle" class="t">Service</text><text x="730" y="143" text-anchor="middle" class="s">état · processus</text><rect x="860" y="90" width="150" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="935" y="120" text-anchor="middle" class="t">Application</text><text x="935" y="143" text-anchor="middle" class="s">requête réelle</text></g><path d="M190 125H245" class="l"/><path d="M395 125H450" class="l"/><path d="M600 125H655" class="l"/><path d="M805 125H860" class="l"/><rect x="230" y="230" width="590" height="80" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="525" y="260" text-anchor="middle" class="t">À chaque étape : observer → formuler une hypothèse → tester</text><text x="525" y="288" text-anchor="middle" class="s">configuration validée + journal corrélé à l'heure du test</text><path d="M525 160V230" class="l"/><path d="M525 310V350" class="l"/><rect x="340" y="350" width="370" height="55" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="525" y="383" text-anchor="middle" class="t">Rejouer le test initial : preuve finale</text></svg>
