<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1655" role="img" aria-labelledby="title desc">
  <title id="title">Les fichiers d'une pile LAMP rangés selon le FHS</title>
  <desc id="desc">Le schéma répartit les fichiers d'Apache, PHP, MariaDB et TLS selon la logique du FHS. Dans etc vivent les configurations administrées : etc apache2 avec apache2.conf, ports.conf et envvars, etc php pour php.ini, etc ssl pour le certificat public et la clé privée, etc mysql pour le serveur de base. Une section détaille le mécanisme available vers enabled pour les modules, les fragments de configuration et les sites, activés par a2enmod, a2enconf et a2ensite. Dans usr se trouvent les modules fournis par le paquet, jamais modifiés ; dans run les fichiers éphémères comme le PID et le socket MariaDB. Dans var vivent le contenu servi, les journaux et les bases de données. Un tableau final associe un besoin, le fichier à modifier, la vérification et la commande d'application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowIndigo" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6366f1"/>
    </marker>
    <style>
      .title{font:800 30px system-ui,sans-serif;fill:#0f172a;letter-spacing:-.5px}
      .subtitle{font:16px system-ui,sans-serif;fill:#475569}
      .zoneTitle{font:800 22px system-ui,sans-serif;fill:#0f172a}
      .path{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#0f172a}
      .file{font:600 15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1e293b}
      .text{font:15px system-ui,sans-serif;fill:#334155}
      .small{font:13px system-ui,sans-serif;fill:#64748b}
      .badge{font:800 12px system-ui,sans-serif;letter-spacing:.7px}
      .incl{stroke:#6366f1;stroke-width:2.7;fill:none;marker-end:url(#arrowIndigo)}
      .th{font:800 14px system-ui,sans-serif;fill:#fff;letter-spacing:.4px}
      .td{font:14px system-ui,sans-serif;fill:#334155}
      .tdm{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1e293b}
    </style>
  </defs>

  <rect width="1400" height="1655" rx="26" fill="url(#bg)"/>
  <text x="700" y="52" text-anchor="middle" class="title">La pile LAMP rangée selon le FHS</text>
  <text x="700" y="84" text-anchor="middle" class="subtitle">Le répertoire annonce la responsabilité : /etc ce que j'administre · /usr ce que le paquet fournit · /var ce qui grossit · /run ce qui disparaît</text>

  <!-- ================= SECTION 1 : /etc ================= -->
  <text x="55" y="134" class="zoneTitle">1 · /etc — la configuration, ce que j'écris et que je sauvegarde</text>
  <line x1="55" y1="146" x2="1345" y2="146" stroke="#cbd5e1" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="55" y="175" width="430" height="215" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="80" y="193" width="200" height="25" rx="12" fill="#2563eb"/>
    <text x="180" y="211" text-anchor="middle" class="badge" fill="#fff">CONFIGURATION APACHE</text>
    <text x="80" y="245" class="path">/etc/apache2/</text>
    <text x="80" y="274" class="file">apache2.conf</text>
    <text x="215" y="274" class="small">point d'entrée, inclut tout</text>
    <text x="80" y="299" class="file">ports.conf</text>
    <text x="215" y="299" class="small">Listen 80 · Listen 443</text>
    <text x="80" y="324" class="file">envvars</text>
    <text x="215" y="324" class="small">APACHE_LOG_DIR · www-data</text>
    <text x="80" y="356" class="small">sites-available/ · mods-available/ · conf-available/</text>
    <text x="80" y="375" class="small">→ le mécanisme est détaillé en section 2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="515" y="175" width="290" height="215" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="540" y="193" width="80" height="25" rx="12" fill="#7c3aed"/>
    <text x="580" y="211" text-anchor="middle" class="badge" fill="#fff">PHP</text>
    <text x="540" y="243" class="path">/etc/php/8.4/</text>
    <text x="540" y="270" class="file">apache2/php.ini</text>
    <text x="540" y="288" class="small">lu si mod_php · display_errors</text>
    <text x="540" y="316" class="file">fpm/php.ini</text>
    <text x="540" y="334" class="small">lu si PHP-FPM — pas le même</text>
    <text x="540" y="360" class="file">fpm/pool.d/*.conf</text>
    <text x="540" y="378" class="small">utilisateur et limites du pool</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="835" y="175" width="270" height="215" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="860" y="193" width="70" height="25" rx="12" fill="#dc2626"/>
    <text x="895" y="211" text-anchor="middle" class="badge" fill="#fff">TLS</text>
    <text x="860" y="243" class="path">/etc/ssl/certs/</text>
    <text x="860" y="267" class="file">fournil.lab.crt</text>
    <text x="860" y="287" class="small">public · envoyé au visiteur</text>
    <text x="860" y="322" class="path">/etc/ssl/private/</text>
    <text x="860" y="346" class="file">fournil.lab.key</text>
    <text x="860" y="366" class="small">secret · 0640 root:ssl-cert</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1135" y="175" width="210" height="215" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <rect x="1160" y="193" width="110" height="25" rx="12" fill="#059669"/>
    <text x="1215" y="211" text-anchor="middle" class="badge" fill="#fff">MARIADB</text>
    <text x="1160" y="245" class="path">/etc/mysql/</text>
    <text x="1160" y="272" class="file">mariadb.conf.d/</text>
    <text x="1160" y="294" class="file">50-server.cnf</text>
    <text x="1160" y="322" class="small">bind-address</text>
    <text x="1160" y="340" class="small">= 127.0.0.1</text>
    <text x="1160" y="368" class="small">aucun accès réseau</text>
  </g>

  <!-- ================= SECTION 2 : available / enabled ================= -->
  <text x="55" y="440" class="zoneTitle">2 · Dans /etc/apache2/ : rien n'est actif tant que le lien n'existe pas</text>
  <line x1="55" y1="452" x2="1345" y2="452" stroke="#cbd5e1" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="55" y="475" width="380" height="95" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="512" class="path">mods-available/</text>
    <text x="80" y="535" class="small">tous les modules installés</text>
    <text x="80" y="553" class="small">ssl · rewrite · php8.4 · headers</text>
  </g>
  <path d="M435 522H620" class="incl"/>
  <text x="527" y="508" text-anchor="middle" class="file">a2enmod ssl</text>
  <text x="527" y="546" text-anchor="middle" class="small">a2dismod pour retirer</text>
  <g filter="url(#shadow)">
    <rect x="620" y="475" width="380" height="95" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="645" y="512" class="path">mods-enabled/</text>
    <text x="645" y="535" class="small">liens symboliques</text>
    <text x="645" y="553" class="small">= chargés au démarrage</text>
  </g>
  <text x="1030" y="512" class="text">Fonctions du serveur</text>
  <text x="1030" y="535" class="small">TLS, interpréteur PHP,</text>
  <text x="1030" y="553" class="small">réécriture d'URL</text>

  <g filter="url(#shadow)">
    <rect x="55" y="585" width="380" height="95" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="622" class="path">conf-available/</text>
    <text x="80" y="645" class="small">fragments de configuration</text>
    <text x="80" y="663" class="small">charset · security · serve-cgi-bin</text>
  </g>
  <path d="M435 632H620" class="incl"/>
  <text x="527" y="618" text-anchor="middle" class="file">a2enconf</text>
  <text x="527" y="656" text-anchor="middle" class="small">a2disconf pour retirer</text>
  <g filter="url(#shadow)">
    <rect x="620" y="585" width="380" height="95" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="645" y="622" class="path">conf-enabled/</text>
    <text x="645" y="645" class="small">liens symboliques</text>
    <text x="645" y="663" class="small">= appliqués globalement</text>
  </g>
  <text x="1030" y="622" class="text">Réglages communs</text>
  <text x="1030" y="645" class="small">à TOUS les sites,</text>
  <text x="1030" y="663" class="small">hors virtual hosts</text>

  <g filter="url(#shadow)">
    <rect x="55" y="695" width="380" height="95" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="732" class="path">sites-available/</text>
    <text x="80" y="755" class="small">un fichier .conf par site</text>
    <text x="80" y="773" class="small">000-default.conf · fournil-web.conf</text>
  </g>
  <path d="M435 742H620" class="incl"/>
  <text x="527" y="728" text-anchor="middle" class="file">a2ensite &lt;site&gt;</text>
  <text x="527" y="766" text-anchor="middle" class="small">a2dissite pour retirer</text>
  <g filter="url(#shadow)">
    <rect x="620" y="695" width="380" height="95" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="645" y="732" class="path">sites-enabled/</text>
    <text x="645" y="755" class="small">les sites réellement servis</text>
    <text x="645" y="773" class="small">ordre alphabétique = priorité</text>
  </g>
  <text x="1030" y="732" class="text">Vos virtual hosts</text>
  <text x="1030" y="755" class="small">le premier chargé devient</text>
  <text x="1030" y="773" class="small">le site par défaut</text>

  <text x="55" y="815" class="small">Même logique que systemctl enable : le fichier existe d'un côté, le lien décide de l'autre. Écrire un vhost sans l'activer ne produit strictement aucun effet.</text>

  <!-- ================= SECTION 3 : /usr et /run ================= -->
  <text x="55" y="865" class="zoneTitle">3 · /usr — fourni par le paquet · /run — recréé à chaque démarrage</text>
  <line x1="55" y1="877" x2="1345" y2="877" stroke="#cbd5e1" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="55" y="900" width="640" height="165" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <rect x="80" y="918" width="230" height="25" rx="12" fill="#64748b"/>
    <text x="195" y="936" text-anchor="middle" class="badge" fill="#fff">FOURNI — NE PAS MODIFIER</text>
    <text x="80" y="972" class="path">/usr/lib/apache2/modules/</text>
    <text x="80" y="997" class="file">mod_ssl.so · libphp8.4.so · mod_rewrite.so</text>
    <text x="80" y="1024" class="file">/usr/sbin/apache2 · apachectl</text>
    <text x="80" y="1048" class="small">Installé et mis à jour par apt : toute retouche est écrasée à la prochaine mise à jour.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="725" y="900" width="620" height="165" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="750" y="918" width="130" height="25" rx="12" fill="#ea580c"/>
    <text x="815" y="936" text-anchor="middle" class="badge" fill="#fff">ÉPHÉMÈRE</text>
    <text x="750" y="958" class="path">/run/apache2/apache2.pid</text>
    <text x="1015" y="958" class="small">PID du processus maître</text>
    <text x="750" y="990" class="path">/run/mysqld/mysqld.sock</text>
    <text x="1015" y="990" class="small">connexion SQL « localhost »</text>
    <text x="750" y="1022" class="path">/run/php/php8.4-fpm.sock</text>
    <text x="1015" y="1022" class="small">présent uniquement si PHP-FPM</text>
    <text x="750" y="1050" class="small">« localhost » passe par ce socket ; « 127.0.0.1 » forcerait du TCP. Tout /run/ est recréé au démarrage.</text>
  </g>

  <!-- ================= SECTION 4 : /var ================= -->
  <text x="55" y="1115" class="zoneTitle">4 · /var — ce qui grossit avec l'usage</text>
  <line x1="55" y1="1127" x2="1345" y2="1127" stroke="#cbd5e1" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="55" y="1150" width="420" height="180" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <rect x="80" y="1168" width="160" height="25" rx="12" fill="#059669"/>
    <text x="160" y="1186" text-anchor="middle" class="badge" fill="#fff">CONTENU SERVI</text>
    <text x="80" y="1222" class="path">/var/www/fournil-web/</text>
    <text x="80" y="1248" class="file">index.php · info.php</text>
    <text x="80" y="1276" class="text">Le DocumentRoot du vhost</text>
    <text x="80" y="1300" class="small">root:www-data · 0750 / 0640</text>
    <text x="80" y="1319" class="small">Apache lit le code, ne l'écrit pas</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="505" y="1150" width="420" height="180" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="530" y="1168" width="130" height="25" rx="12" fill="#ea580c"/>
    <text x="595" y="1186" text-anchor="middle" class="badge" fill="#fff">JOURNAUX</text>
    <text x="530" y="1222" class="path">/var/log/apache2/</text>
    <text x="530" y="1248" class="file">fournil-error.log</text>
    <text x="530" y="1270" class="file">fournil-access.log</text>
    <text x="530" y="1298" class="text">Définis par ErrorLog / CustomLog</text>
    <text x="530" y="1319" class="small">la réponse quand la page reste blanche</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="955" y="1150" width="390" height="180" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="980" y="1168" width="150" height="25" rx="12" fill="#7c3aed"/>
    <text x="1055" y="1186" text-anchor="middle" class="badge" fill="#fff">DONNÉES SQL</text>
    <text x="980" y="1222" class="path">/var/lib/mysql/</text>
    <text x="980" y="1248" class="file">fournil_web/</text>
    <text x="980" y="1276" class="text">Les bases elles-mêmes</text>
    <text x="980" y="1300" class="small">jamais éditées à la main :</text>
    <text x="980" y="1319" class="small">on passe par SQL ou mariadb-dump</text>
  </g>

  <!-- ================= SECTION 5 : décision ================= -->
  <text x="55" y="1380" class="zoneTitle">5 · Je veux faire quoi ? → quel fichier, quelle vérification</text>
  <line x1="55" y1="1392" x2="1345" y2="1392" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="55" y="1410" width="1290" height="32" rx="8" fill="#334155"/>
  <text x="75" y="1431" class="th">MON BESOIN</text>
  <text x="430" y="1431" class="th">FICHIER OU COMMANDE</text>
  <text x="810" y="1431" class="th">VÉRIFIER AVEC</text>
  <text x="1145" y="1431" class="th">APPLIQUER</text>

  <rect x="55" y="1442" width="1290" height="33" fill="#ffffff"/>
  <text x="75" y="1464" class="td">Ouvrir un port supplémentaire</text>
  <text x="430" y="1464" class="tdm">/etc/apache2/ports.conf</text>
  <text x="810" y="1464" class="tdm">apache2ctl configtest</text>
  <text x="1145" y="1464" class="tdm">systemctl restart</text>

  <rect x="55" y="1475" width="1290" height="33" fill="#f1f5f9"/>
  <text x="75" y="1497" class="td">Activer TLS, PHP, une réécriture</text>
  <text x="430" y="1497" class="tdm">a2enmod &lt;module&gt;</text>
  <text x="810" y="1497" class="tdm">apache2ctl -M</text>
  <text x="1145" y="1497" class="tdm">systemctl restart</text>

  <rect x="55" y="1508" width="1290" height="33" fill="#ffffff"/>
  <text x="75" y="1530" class="td">Ajouter ou modifier un site</text>
  <text x="430" y="1530" class="tdm">sites-available/*.conf + a2ensite</text>
  <text x="810" y="1530" class="tdm">configtest puis apache2ctl -S</text>
  <text x="1145" y="1530" class="tdm">systemctl reload</text>

  <rect x="55" y="1541" width="1290" height="33" fill="#f1f5f9"/>
  <text x="75" y="1563" class="td">Changer une limite PHP</text>
  <text x="430" y="1563" class="tdm">/etc/php/8.4/{apache2|fpm}/php.ini</text>
  <text x="810" y="1563" class="tdm">phpinfo() ou php -i</text>
  <text x="1145" y="1563" class="tdm">systemctl reload</text>

  <rect x="55" y="1574" width="1290" height="35" fill="#fef2f2"/>
  <rect x="55" y="1574" width="6" height="35" fill="#dc2626"/>
  <text x="75" y="1597" class="td" fill="#991b1b">Page blanche ou erreur 500</text>
  <text x="430" y="1597" class="td" fill="#991b1b">ne rien modifier : d'abord lire</text>
  <text x="810" y="1597" class="tdm" fill="#991b1b">tail -f …/fournil-error.log</text>
  <text x="1145" y="1597" class="td" fill="#991b1b">aucune</text>

  <text x="55" y="1636" class="small">Redémarrer (restart) pour un port ou un module ; recharger (reload) pour un vhost ou php.ini — le rechargement ne coupe pas les connexions en cours.</text>
</svg>
