<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 970" role="img" aria-labelledby="title desc">
  <title id="title">Fichiers de systemd-journald selon le FHS</title>
  <desc id="desc">Le schéma distingue les configurations de la distribution dans usr lib, de l'administrateur dans etc et temporaires dans run. Systemd-journald fusionne ces paramètres puis écrit un journal volatil dans run log journal ou persistant dans var log journal. Journalctl lit les deux emplacements et rsyslog peut produire des fichiers texte dans var log.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="daemon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6366f1"/>
    </marker>
    <style>
      .title{font:800 30px system-ui,sans-serif;fill:#0f172a;letter-spacing:-.5px}
      .subtitle{font:16px system-ui,sans-serif;fill:#475569}
      .zoneTitle{font:800 22px system-ui,sans-serif;fill:#0f172a}
      .path{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#0f172a}
      .file{font:600 15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1e293b}
      .text{font:15px system-ui,sans-serif;fill:#334155}
      .small{font:13px system-ui,sans-serif;fill:#64748b}
      .badge{font:800 12px system-ui,sans-serif;letter-spacing:.7px}
      .whiteTitle{font:800 23px system-ui,sans-serif;fill:#fff}
      .whiteText{font:15px system-ui,sans-serif;fill:#e0e7ff}
      .whiteSmall{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e0e7ff}
      .flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .configFlow{stroke:#6366f1;stroke-width:2.7;fill:none;marker-end:url(#arrowPurple)}
      .readFlow{stroke:#0284c7;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="970" rx="26" fill="url(#bg)"/>
  <text x="700" y="48" text-anchor="middle" class="title">Journald dans le FHS : configurer, stocker, consulter</text>
  <text x="700" y="76" text-anchor="middle" class="subtitle">Les chemins ne sont pas interchangeables : chacun répond à une règle de durée et de responsabilité</text>

  <!-- Configuration -->
  <text x="55" y="120" class="zoneTitle">1 · Fichiers de configuration</text>
  <line x1="55" y1="132" x2="1345" y2="132" stroke="#cbd5e1" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="55" y="158" width="300" height="180" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M80 182h56l14 15h180v124H80Z" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="96" y="211" class="path">/usr/lib/</text>
    <text x="96" y="234" class="path">/usr/local/lib/</text>
    <text x="96" y="260" class="file">systemd/</text>
    <text x="96" y="282" class="file">journald.conf.d/</text>
    <text x="96" y="304" class="file">*.conf</text>
    <rect x="239" y="170" width="98" height="24" rx="12" fill="#2563eb"/>
    <text x="288" y="187" text-anchor="middle" class="badge" fill="#fff">DISTRIBUTION</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="158" width="350" height="180" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <path d="M405 182h56l14 15h230v124H405Z" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="421" y="224" class="path">/etc/systemd/</text>
    <text x="421" y="252" class="file">journald.conf</text>
    <text x="421" y="276" class="file">journald.conf.d/60-tssr.conf</text>
    <text x="421" y="304" class="text">Choix persistants de l'administrateur</text>
    <rect x="617" y="170" width="95" height="24" rx="12" fill="#7c3aed"/>
    <text x="664" y="187" text-anchor="middle" class="badge" fill="#fff">PRIORITÉ 1</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="755" y="158" width="300" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M780 182h56l14 15h180v124H780Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="796" y="224" class="path">/run/systemd/</text>
    <text x="796" y="254" class="file">journald.conf.d/*.conf</text>
    <text x="796" y="286" class="text">Surcharge temporaire d'exécution</text>
    <text x="796" y="306" class="small">volatile · effacée au redémarrage</text>
    <rect x="942" y="170" width="95" height="24" rx="12" fill="#d97706"/>
    <text x="989" y="187" text-anchor="middle" class="badge" fill="#fff">TEMPORAIRE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="158" width="265" height="180" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="1105" y="205" class="zoneTitle">Ordre effectif</text>
    <text x="1105" y="237" class="file">1. /etc</text>
    <text x="1105" y="262" class="file">2. /run</text>
    <text x="1105" y="287" class="file">3. /usr/local/lib</text>
    <text x="1105" y="312" class="file">4. /usr/lib</text>
    <text x="1288" y="237" text-anchor="end" class="small">priorité haute</text>
    <text x="1105" y="329" class="small">à nom de fragment identique</text>
  </g>

  <!-- Merge and daemon -->
  <path d="M205 338V378H522" class="configFlow"/>
  <path d="M555 338V378" class="configFlow"/>
  <path d="M905 338V378H588" class="configFlow"/>
  <rect x="430" y="366" width="250" height="42" rx="21" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="555" y="393" text-anchor="middle" class="text" font-weight="700">configuration fusionnée</text>
  <path d="M680 387H760" class="configFlow"/>

  <g filter="url(#shadow)">
    <rect x="760" y="355" width="420" height="125" rx="22" fill="url(#daemon)"/>
    <circle cx="810" cy="403" r="23" fill="#818cf8"/>
    <path d="M796 403h28M810 389v28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="850" y="397" class="whiteTitle">systemd-journald</text>
    <text x="850" y="426" class="whiteText">collecte · indexe · compresse · rotation</text>
    <text x="850" y="452" class="whiteSmall">Storage=auto | persistent | volatile | none</text>
  </g>

  <!-- Storage -->
  <text x="55" y="525" class="zoneTitle">2 · Données variables produites pendant l'exécution</text>
  <line x1="55" y1="537" x2="1345" y2="537" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M915 480V555H340V585" class="flow"/>
  <path d="M1025 480V555H850V585" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="55" y="585" width="570" height="205" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="75" y="603" width="115" height="27" rx="13" fill="#ea580c"/>
    <text x="132" y="622" text-anchor="middle" class="badge" fill="#fff">VOLATILE</text>
    <text x="82" y="670" class="path">/run/log/journal/&lt;machine-id&gt;/</text>
    <text x="82" y="705" class="file">system.journal</text>
    <text x="82" y="734" class="text">tmpfs · démarrage courant uniquement</text>
    <text x="82" y="762" class="small">Storage=volatile · perdu au reboot</text>
    <rect x="470" y="610" width="125" height="48" rx="12" fill="#ffedd5" stroke="#fb923c"/>
    <text x="532" y="630" text-anchor="middle" class="small">limites</text>
    <text x="532" y="649" text-anchor="middle" class="file">Runtime*</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="585" width="695" height="205" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <rect x="670" y="603" width="125" height="27" rx="13" fill="#059669"/>
    <text x="732" y="622" text-anchor="middle" class="badge" fill="#fff">PERSISTANT</text>
    <text x="677" y="670" class="path">/var/log/journal/&lt;machine-id&gt;/</text>
    <text x="677" y="705" class="file">system.journal · user-UID.journal</text>
    <text x="677" y="734" class="file">system@….journal · *.journal~</text>
    <text x="677" y="764" class="small">Storage=persistent · conservé entre les boots</text>
    <rect x="1185" y="610" width="130" height="48" rx="12" fill="#d1fae5" stroke="#34d399"/>
    <text x="1250" y="630" text-anchor="middle" class="small">limites</text>
    <text x="1250" y="649" text-anchor="middle" class="file">System*</text>
  </g>

  <!-- Consumers -->
  <path d="M340 790V875H435" class="readFlow"/>
  <path d="M990 790V875H875" class="readFlow"/>
  <g filter="url(#shadow)">
    <rect x="435" y="825" width="440" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="655" y="862" text-anchor="middle" class="zoneTitle">journalctl</text>
    <text x="655" y="893" text-anchor="middle" class="text">lit les deux emplacements binaires</text>
    <text x="655" y="916" text-anchor="middle" class="small">consultation uniquement · aucune édition directe</text>
  </g>

  <g>
    <rect x="915" y="825" width="430" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="940" y="862" class="path">/var/log/*.log</text>
    <text x="940" y="893" class="text">texte produit par rsyslog ou l'application</text>
    <text x="940" y="916" class="small">stockage distinct du journal binaire</text>
    <path d="M1180 420H1370V875H1345" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/>
    <text x="1360" y="520" text-anchor="end" class="small">ForwardToSyslog=yes</text>
  </g>

  <text x="55" y="952" class="small">Lecture FHS : /etc configure · /usr fournit · /run est temporaire · /var/log conserve les journaux variables</text>
</svg>
