<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Dépendances et activation systemd</title><desc id="desc">La cible multi-user regroupe des services activés par des liens WantedBy, tandis que les relations Wants et After ont des rôles différents.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.h{font:700 21px system-ui,sans-serif;fill:#0f172a}.t{font:600 17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1120" height="460" rx="20" fill="#f8fafc"/><text x="560" y="38" text-anchor="middle" class="h">Une target coordonne des unités, elle n'est pas un processus</text>
  <rect x="55" y="155" width="230" height="105" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="170" y="192" text-anchor="middle" class="t">multi-user.target</text><text x="170" y="220" text-anchor="middle" class="s">objectif de démarrage</text><text x="170" y="244" text-anchor="middle" class="s">mode serveur multi-utilisateur</text>
  <rect x="405" y="70" width="230" height="82" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="520" y="104" text-anchor="middle" class="t">ssh.service</text><text x="520" y="130" text-anchor="middle" class="s">accès d'administration</text>
  <rect x="405" y="168" width="230" height="82" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="520" y="202" text-anchor="middle" class="t">bind9.service</text><text x="520" y="228" text-anchor="middle" class="s">résolution DNS</text>
  <rect x="405" y="266" width="230" height="82" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="520" y="300" text-anchor="middle" class="t">apache2.service</text><text x="520" y="326" text-anchor="middle" class="s">publication HTTP</text>
  <path d="M285 185L405 111" class="flow"/><path d="M285 208H405" class="flow"/><path d="M285 232L405 307" class="flow"/>
  <rect x="755" y="75" width="310" height="105" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="910" y="108" text-anchor="middle" class="t">Wants= / Requires=</text><text x="910" y="136" text-anchor="middle" class="s">relation de dépendance :</text><text x="910" y="159" text-anchor="middle" class="s">quelles unités sont attirées ?</text>
  <rect x="755" y="225" width="310" height="105" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="910" y="258" text-anchor="middle" class="t">Before= / After=</text><text x="910" y="286" text-anchor="middle" class="s">relation d'ordre :</text><text x="910" y="309" text-anchor="middle" class="s">dans quelle séquence démarrent-elles ?</text>
  <path d="M635 111H755" class="flow"/><path d="M635 307H755" class="flow"/>
  <rect x="295" y="385" width="530" height="42" rx="10" fill="#fff" stroke="#94a3b8"/><text x="560" y="412" text-anchor="middle" class="s">enable crée le lien d'activation · start agit maintenant · deux états indépendants</text>
</svg>
