<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Cycle de vie d'un service systemd</title><desc id="desc">Les commandes start, stop, reload et restart agissent sur l'état courant ; enable et disable agissent séparément sur le prochain démarrage.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.h{font:700 21px system-ui,sans-serif;fill:#0f172a}.t{font:600 18px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.flow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c3aed;stroke-width:2.3;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1120" height="430" rx="20" fill="#f8fafc"/><text x="560" y="38" text-anchor="middle" class="h">Deux axes indépendants : maintenant et au prochain boot</text>
  <text x="95" y="92" class="t">État courant</text>
  <rect x="105" y="130" width="235" height="110" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="222" y="175" text-anchor="middle" class="t">inactive</text><text x="222" y="205" text-anchor="middle" class="s">aucun processus en service</text>
  <rect x="500" y="130" width="235" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="617" y="175" text-anchor="middle" class="t">active (running)</text><text x="617" y="205" text-anchor="middle" class="s">service actuellement rendu</text>
  <rect x="850" y="130" width="190" height="110" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="945" y="175" text-anchor="middle" class="t">failed</text><text x="945" y="205" text-anchor="middle" class="s">échec à expliquer</text>
  <path d="M340 160H500" class="flow"/><text x="420" y="145" text-anchor="middle" class="s">start</text><path d="M500 215H340" class="flow"/><text x="420" y="235" text-anchor="middle" class="s">stop</text><path d="M735 185H850" class="flow"/><text x="792" y="170" text-anchor="middle" class="s">erreur</text><path d="M890 240C825 285 715 270 680 240" class="flow"/><text x="800" y="285" text-anchor="middle" class="s">restart après correction</text>
  <path d="M570 130C530 72 705 72 665 130" class="flow"/><text x="617" y="78" text-anchor="middle" class="s">reload : relire sans couper</text>
  <line x1="70" y1="315" x2="1050" y2="315" stroke="#cbd5e1" stroke-width="2"/><text x="95" y="350" class="t">Prochain boot</text>
  <rect x="285" y="340" width="220" height="60" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="395" y="377" text-anchor="middle" class="t">disabled</text><rect x="650" y="340" width="220" height="60" rx="13" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="760" y="377" text-anchor="middle" class="t">enabled</text><path d="M505 358H650" class="dash"/><text x="577" y="345" text-anchor="middle" class="s">enable</text><path d="M650 390H505" class="dash"/><text x="577" y="415" text-anchor="middle" class="s">disable</text>
</svg>
