<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 280" role="img" aria-labelledby="t d"><title id="t">Séquence de démarrage Linux</title><desc id="d">Chaîne de responsabilités du firmware jusqu'aux services.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.t{font:16px system-ui,sans-serif;fill:#0f172a}.s{font:13px system-ui,sans-serif;fill:#475569}.l{stroke:#334155;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1150" height="280" rx="18" fill="#f8fafc"/><text x="575" y="35" text-anchor="middle" class="t" font-weight="700">Chaque étape prépare la suivante</text><g><rect x="25" y="90" width="135" height="90" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="92" y="125" text-anchor="middle" class="t">BIOS / UEFI</text><text x="92" y="150" text-anchor="middle" class="s">initialise</text><text x="92" y="168" text-anchor="middle" class="s">le matériel</text><rect x="205" y="90" width="135" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="272" y="125" text-anchor="middle" class="t">GRUB</text><text x="272" y="150" text-anchor="middle" class="s">choisit noyau</text><text x="272" y="168" text-anchor="middle" class="s">et paramètres</text><rect x="385" y="90" width="135" height="90" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="452" y="125" text-anchor="middle" class="t">Noyau</text><text x="452" y="150" text-anchor="middle" class="s">CPU, mémoire,</text><text x="452" y="168" text-anchor="middle" class="s">pilotes intégrés</text><rect x="565" y="90" width="135" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="632" y="125" text-anchor="middle" class="t">initramfs</text><text x="632" y="150" text-anchor="middle" class="s">atteint la vraie</text><text x="632" y="168" text-anchor="middle" class="s">racine /</text><rect x="745" y="90" width="135" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="812" y="125" text-anchor="middle" class="t">systemd</text><text x="812" y="150" text-anchor="middle" class="s">PID 1, unités,</text><text x="812" y="168" text-anchor="middle" class="s">dépendances</text><rect x="925" y="90" width="190" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1020" y="125" text-anchor="middle" class="t">Services / login</text><text x="1020" y="150" text-anchor="middle" class="s">SSH, DNS, Web…</text><text x="1020" y="168" text-anchor="middle" class="s">machine utilisable</text></g><path d="M160 135H205" class="l"/><path d="M340 135H385" class="l"/><path d="M520 135H565" class="l"/><path d="M700 135H745" class="l"/><path d="M880 135H925" class="l"/><text x="575" y="230" text-anchor="middle" class="s">Localiser la panne : firmware → chargeur → noyau/initramfs → unités systemd</text></svg>
