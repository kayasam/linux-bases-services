<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc">
  <title id="title">Choisir un mécanisme de planification Linux</title><desc id="desc">Un arbre de décision oriente vers at pour une exécution unique, cron pour une récurrence simple et un timer systemd pour une tâche intégrée aux services.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.h{font:700 21px system-ui,sans-serif;fill:#0f172a}.t{font:600 17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1160" height="470" rx="20" fill="#f8fafc"/><text x="580" y="38" text-anchor="middle" class="h">Quel outil pour quelle tâche ?</text>
  <polygon points="180,95 310,165 180,235 50,165" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="180" y="157" text-anchor="middle" class="t">La tâche doit-elle</text><text x="180" y="181" text-anchor="middle" class="t">se répéter ?</text>
  <rect x="405" y="70" width="235" height="105" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="522" y="108" text-anchor="middle" class="t">at</text><text x="522" y="137" text-anchor="middle" class="s">une seule exécution</text><text x="522" y="160" text-anchor="middle" class="s">file consultable avec atq</text>
  <polygon points="520,245 650,315 520,385 390,315" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="520" y="296" text-anchor="middle" class="t">Besoin de logs,</text><text x="520" y="320" text-anchor="middle" class="t">dépendances ou</text><text x="520" y="344" text-anchor="middle" class="t">rattrapage ?</text>
  <rect x="770" y="235" width="300" height="105" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="920" y="273" text-anchor="middle" class="t">timer systemd + service</text><text x="920" y="302" text-anchor="middle" class="s">journalctl · Persistent=true</text><text x="920" y="325" text-anchor="middle" class="s">dépendances et code retour</text>
  <rect x="770" y="360" width="300" height="82" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="920" y="394" text-anchor="middle" class="t">cron</text><text x="920" y="420" text-anchor="middle" class="s">récurrence simple · 5 champs</text>
  <path d="M310 145L405 122" class="flow"/><text x="355" y="115" text-anchor="middle" class="s">non</text><path d="M230 225L410 285" class="flow"/><text x="315" y="273" text-anchor="middle" class="s">oui</text><path d="M650 295L770 285" class="flow"/><text x="710" y="276" text-anchor="middle" class="s">oui</text><path d="M650 350L770 395" class="flow"/><text x="710" y="390" text-anchor="middle" class="s">non</text>
  <rect x="55" y="390" width="575" height="48" rx="10" fill="#fff7ed" stroke="#fb923c"/><text x="342" y="420" text-anchor="middle" class="s">Toujours tester manuellement avec le même utilisateur et le même environnement.</text>
</svg>
