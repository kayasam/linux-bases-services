<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Chargement d'un module noyau et prise en charge d'un périphérique</title>
  <desc id="desc">Modprobe consulte la configuration et les dépendances, charge le fichier ko dans le noyau, qui prend ensuite en charge le périphérique.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.h{font:700 21px system-ui,sans-serif;fill:#0f172a}.t{font:600 17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#475569}.box{stroke-width:2}.flow{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1120" height="440" rx="20" fill="#f8fafc"/><text x="560" y="38" text-anchor="middle" class="h">Du besoin matériel au pilote actif</text>
  <rect x="35" y="145" width="180" height="110" rx="14" fill="#fef3c7" stroke="#d97706" class="box"/><text x="125" y="180" text-anchor="middle" class="t">Administrateur</text><text x="125" y="207" text-anchor="middle" class="s">modprobe e1000</text><text x="125" y="230" text-anchor="middle" class="s">chargement à chaud</text>
  <rect x="270" y="95" width="230" height="210" rx="16" fill="#e0f2fe" stroke="#0284c7" class="box"/><text x="385" y="132" text-anchor="middle" class="t">modprobe</text><text x="385" y="163" text-anchor="middle" class="s">1. lit /etc/modprobe.d/</text><text x="385" y="190" text-anchor="middle" class="s">2. résout les dépendances</text><text x="385" y="217" text-anchor="middle" class="s">3. applique les paramètres</text><rect x="310" y="242" width="150" height="42" rx="8" fill="#fff" stroke="#7dd3fc"/><text x="385" y="268" text-anchor="middle" class="s">depmod / modules.dep</text>
  <rect x="560" y="95" width="220" height="110" rx="14" fill="#ede9fe" stroke="#7c3aed" class="box"/><text x="670" y="132" text-anchor="middle" class="t">Module sur disque</text><text x="670" y="160" text-anchor="middle" class="s">/lib/modules/$(uname -r)</text><text x="670" y="184" text-anchor="middle" class="s">e1000.ko.xz</text>
  <rect x="560" y="245" width="220" height="110" rx="14" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="670" y="282" text-anchor="middle" class="t">Noyau en mémoire</text><text x="670" y="310" text-anchor="middle" class="s">module chargé · lsmod</text><text x="670" y="334" text-anchor="middle" class="s">paramètres dans /sys</text>
  <rect x="850" y="170" width="225" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" class="box"/><text x="962" y="207" text-anchor="middle" class="t">Périphérique utilisable</text><text x="962" y="235" text-anchor="middle" class="s">carte → interface enp0s8</text><text x="962" y="259" text-anchor="middle" class="s">preuve : lspci -nnk</text>
  <path d="M215 200H270" class="flow"/><path d="M500 150H560" class="flow"/><path d="M670 205V245" class="flow"/><path d="M780 300L850 250" class="flow"/>
  <rect x="300" y="380" width="520" height="38" rx="9" fill="#fff7ed" stroke="#fb923c"/><text x="560" y="405" text-anchor="middle" class="s">Diagnostic : uname -r → modinfo → modprobe -v → journalctl -k → lspci -nnk</text>
</svg>
